<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="S Aegonem">
<meta name="description" content="Stopuj s Aegonem – sbírej českou faunu venku.">
<title>Stopuj s Aegonem</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <div class="htitle"><h1 id="logo">Stopuj s Aegonem</h1><div class="hsub" id="hbio">–</div></div>
    <div class="hstat"><span id="hgps" title="Přesnost polohy">GPS –</span><span id="hdist">dnes 0,0 km</span></div>
    <button class="rose" id="roseBtn" aria-label="Sever a kompas"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/><g id="roseN"><path d="M20 4l5 16h-10z" fill="#d9442b"/><path d="M20 36l-5-16h10z" fill="currentColor" fill-opacity=".55"/><circle cx="20" cy="20" r="2.2" fill="#fff" stroke="currentColor" stroke-width="1"/></g><text x="20" y="3.6" text-anchor="middle" font-size="5" font-weight="700" fill="#d9442b" id="roseL">S</text></svg></button>
    <button class="hbtn" id="lvlBtn" aria-label="Úroveň a úkoly" hidden>Úr. 1</button>
    <button class="hbtn" id="coneBtn" aria-label="Šišky a obchod" hidden>0</button>
    <button class="hbtn" id="menuBtn" aria-label="Menu">Menu</button>
  </header>
  <main>
    <section class="view on" id="mapv">
      <div id="map"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="corner" id="corner">
        <button class="cbtn" id="clFab" aria-label="Kontrolní seznam pro testery" title="Testeři" hidden><span data-ic="tester"></span></button>
        <button class="cbtn" id="dataBtn" aria-label="Stahovaná data" title="Stahovaná data" hidden><span data-ic="data"></span></button>
      </div>
      <div class="maptools" id="tools">
        <button class="tool" id="lookBtn" aria-label="Vrstvy mapy" title="Vrstvy" hidden><span data-ic="layers"></span></button>
      </div>
      <div class="cards" id="cards" aria-live="polite"></div>
      <div class="legend" id="legend"></div>
      <div class="plpanel" id="plpanel" hidden></div>
      <div class="mute" id="mute" aria-live="polite"><b>👀 Zastav se a rozhlédni se</b><span>Zvířata se ukážou, až zastavíš. Vibrace ti dá vědět, že je něco blízko.</span></div>
      <div class="dimlay" id="dim"></div>
      <div class="kennel" id="kennel" hidden><span data-ic="kennel"></span><b>Pustit na volno</b></div>
      <button class="dog" id="dog" aria-label="Pes Aegon (posuň prstem)" hidden><img alt="" draggable="false"><i class="think" aria-hidden="true"></i></button>
    </section>
    <section class="view" id="atlasv"></section>
    <section class="view" id="sbirkav"></section>
    <section class="view" id="farmv"></section>
    <section class="view" id="jav"></section>
    <section class="view" id="adminv"></section>
    <div id="toast" role="status"></div>
  </main>
  <nav id="nav">
    <button class="on" data-v="mapv"><span data-ic="map"></span>Mapa</button>
    <button data-v="farmv"><span data-ic="farm"></span><em id="navCol">Farma</em></button>
    <button class="act" id="actBtn" aria-label="Akce"><i id="actIc"></i><span id="actLbl">Plánovat</span></button>
    <button data-kid="games"><span data-ic="games"></span>Hry</button>
    <button data-v="atlasv"><span data-ic="atlas"></span>Atlas</button>
    <button data-v="jav"><span data-ic="me"></span><em id="navMe">Já</em></button>
  </nav>
  <div class="splash" id="splash" hidden></div>
  <div id="modal"><div id="mbox"></div></div>
  <div class="redlay" id="redlay"></div>
</div>
<noscript>Stopuj s Aegonem potřebuje zapnutý JavaScript.</noscript>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="vendor/maplibre-contour/index.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
