<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stopař">
<meta name="description" content="Stopař – sbírej českou faunu venku.">
<title>Stopař</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <h1 id="logo">Stopař</h1>
    <span class="sp"></span>
    <span class="pill" id="hgps" title="Přesnost GPS">GPS –</span>
    <button class="hbtn" id="menuBtn" aria-label="Menu">Menu</button>
  </header>
  <main>
    <section class="view on" id="mapv">
      <div id="map"></div>
      <div class="hud">
        <div class="pill" id="hbio">Biotop: –</div>
        <div class="pill" id="hdist">0,0 km</div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <button class="fab" id="centerBtn" aria-label="Vycentrovat">Na mě</button>
      <div class="legend" id="legend"></div>
    </section>
    <section class="view" id="atlasv"></section>
    <section class="view" id="adminv"></section>
    <div id="toast" role="status"></div>
  </main>
  <nav>
    <button class="on" data-v="mapv">Mapa</button>
    <button data-v="atlasv">Atlas</button>
  </nav>
  <div id="modal"><div id="mbox"></div></div>
</div>
<noscript>Stopař potřebuje zapnutý JavaScript.</noscript>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
