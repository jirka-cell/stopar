<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stopař">
<meta name="description" content="Stopař – sbírej českou faunu venku.">
<title>Stopař</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <h1 id="logo">Stopař</h1>
    <span class="sp"></span>
    <span class="pill" id="hgps" title="Přesnost GPS">GPS –</span>
    <button class="hbtn lvl" id="lvlBtn" aria-label="Úroveň a úkoly">Úr. 1</button>
    <button class="hbtn" id="coneBtn" aria-label="Šišky a obchod">0</button>
    <button class="hbtn" id="menuBtn" aria-label="Menu">Menu</button>
  </header>
  <main>
    <section class="view on" id="mapv">
      <div id="map"></div>
      <div class="hud">
        <div class="pill" id="hbio">Biotop: –</div>
        <div class="pill" id="hdist">0,0 km</div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="netmon" id="netmon" role="button" tabindex="0" aria-label="Stahovaná data" hidden></div>
      <div class="maptools" id="tools">
        <button class="tool" data-tool="tester" id="clFab" hidden><span data-ic="tester"></span><b>Testeři</b></button>
        <button class="tool" data-tool="data"><span data-ic="data"></span><b>Data</b></button>
        <button class="tool" data-tool="offline"><span data-ic="offline"></span><b>Offline</b></button>
        <button class="tool" data-tool="measure"><span data-ic="measure"></span><b>Měřit</b></button>
        <button class="tool" id="lookBtn" hidden><span data-ic="layers"></span><b>Vrstvy</b></button>
        <button class="tool" id="compassBtn" hidden><span data-ic="compass"></span><b>Kompas</b></button>
      </div>
      <button class="recenter" id="centerBtn" aria-label="Vycentrovat na mě"><span data-ic="center"></span> Na mě</button>
      <div class="cards" id="cards" aria-live="polite"></div>
      <button class="dial" id="dialBtn" aria-label="Otevřít nabídku" aria-expanded="false"><span data-ic="dial"></span></button>
      <div class="legend" id="legend"></div>
      <div class="plpanel" id="plpanel" hidden></div>
      <div class="mute" id="mute" aria-live="polite"><b>👀 Zastav se a rozhlédni se</b><span>Zvířata se ukážou, až zastavíš. Vibrace ti dá vědět, že je něco blízko.</span></div>
      <div class="dimlay" id="dim"></div>
      <div class="kennel" id="kennel" hidden><span data-ic="kennel"></span><b>Pustit na volno</b></div>
      <button class="dog" id="dog" aria-label="Pes Aegon (posuň prstem)" hidden><img alt="" draggable="false"><i class="think" aria-hidden="true"></i></button>
    </section>
    <section class="view" id="atlasv"></section>
    <section class="view" id="sbirkav"></section>
    <section class="view" id="farmv"></section>
    <section class="view" id="jav"></section>
    <section class="view" id="adminv"></section>
    <div id="toast" role="status"></div>
  </main>
  <nav id="nav">
    <button class="on" data-v="mapv"><span data-ic="map"></span>Mapa</button>
    <button data-v="farmv"><span data-ic="farm"></span><em id="navCol">Farma</em></button>
    <button class="act" id="actBtn" aria-label="Akce"><i id="actIc"></i><span id="actLbl">Plánovat</span></button>
    <button data-kid="games"><span data-ic="games"></span>Hry</button>
    <button data-v="atlasv"><span data-ic="atlas"></span>Atlas</button>
    <button data-v="jav"><span data-ic="me"></span><em id="navMe">Já</em></button>
  </nav>
  <div id="modal"><div id="mbox"></div></div>
  <div class="redlay" id="redlay"></div>
</div>
<noscript>Stopař potřebuje zapnutý JavaScript.</noscript>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="vendor/maplibre-contour/index.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
